[[headers]]
  for = "/*"
  [headers.values]
    # Required to allow webcam in all modern browsers on Netlify HTTPS
    Permissions-Policy = "camera=(self)"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
